AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Product Service - SAM Local Testing

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    Environment:
      Variables:
        PRODUCT_TABLE: !Ref ProductTable

Resources:
  # DynamoDB Table
  ProductTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: products-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CategoryIndex
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Lambda Functions
  ListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/list_products/
      Handler: app.lambda_handler
      Events:
        ListProducts:
          Type: Api
          Properties:
            Path: /products
            Method: get
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductTable

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_product/
      Handler: app.lambda_handler
      Events:
        GetProduct:
          Type: Api
          Properties:
            Path: /products/{productId}
            Method: get
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductTable

Outputs:
  ProductApi:
    Description: "API Gateway endpoint URL for Product Service"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  ProductTable:
    Description: "DynamoDB Product Table"
    Value: !Ref ProductTable
