version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing test dependencies..."
      - pip install requests pytest boto3

  pre_build:
    commands:
      - echo "Fetching API endpoint..."
      - export API_ENDPOINT=$(aws ssm get-parameter --name /product-service/dev/api-endpoint --query 'Parameter.Value' --output text 2>/dev/null || echo "")
      - |
        if [ -z "$API_ENDPOINT" ]; then
          echo "Fetching from CloudFormation..."
          export API_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name product-service-dev \
            --query 'Stacks[0].Outputs[?OutputKey==`ProductApiUrl`].OutputValue' \
            --output text)
        fi
      - echo "API Endpoint: $API_ENDPOINT"

  build:
    commands:
      - echo "Running integration tests..."
      - python -m pytest integration-tests/ -v --junitxml=integration-test-results.xml

  post_build:
    commands:
      - |
        if [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ]; then
          echo "Integration tests passed"
        else
          echo "Integration tests failed"
          exit 1
        fi

reports:
  integration-test-results:
    files:
      - integration-test-results.xml
    file-format: JUNITXML

artifacts:
  files:
    - integration-test-results.xml
  name: integration-test-results
