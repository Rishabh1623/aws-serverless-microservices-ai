version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing SAM CLI..."
      - pip install aws-sam-cli
      - sam --version

  pre_build:
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt -t src/add_cart/
      - pip install -r requirements.txt -t src/remove_cart/
      - pip install -r requirements.txt -t src/get_cart/
      - echo "Running unit tests..."
      - python -m pytest tests/ -v

  build:
    commands:
      - echo "Building SAM application..."
      - sam build --use-container

  post_build:
    commands:
      - echo "Packaging SAM application..."
      - sam package --output-template-file packaged.yaml --s3-bucket $ARTIFACT_BUCKET

artifacts:
  files:
    - packaged.yaml
    - samconfig.toml
  name: cart-service-build

cache:
  paths:
    - '/root/.cache/pip/**/*'
