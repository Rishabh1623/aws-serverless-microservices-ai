AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hotel Service - SAM Template for Local Development

# This template is for LOCAL TESTING ONLY
# Production deployments use Terraform (terraform/hotel-service/dev/)

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        HOTEL_TABLE: !Ref HotelsTable
        ROOM_TABLE: !Ref RoomsTable
        BOOKING_TABLE: !Ref BookingsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        EVENT_BUS_NAME: travel-platform-dev
        ENVIRONMENT: local
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Resources:
  # ============================================================================
  # LAMBDA FUNCTIONS
  # ============================================================================

  SearchHotelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hotel-service-search-hotels-local
      CodeUri: src/search_hotels/
      Handler: app.lambda_handler
      Description: Search hotels by location and filters
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HotelsTable
      Events:
        SearchHotels:
          Type: Api
          Properties:
            Path: /hotels
            Method: GET

  GetHotelFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hotel-service-get-hotel-local
      CodeUri: src/get_hotel/
      Handler: app.lambda_handler
      Description: Get hotel details by ID
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HotelsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RoomsTable
      Events:
        GetHotel:
          Type: Api
          Properties:
            Path: /hotels/{hotelId}
            Method: GET

  CreateBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hotel-service-create-booking-local
      CodeUri: src/create_booking/
      Handler: app.lambda_handler
      Description: Create hotel booking with transactions
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - EventBridgePutEventsPolicy:
            EventBusName: travel-platform-dev
      Events:
        CreateBooking:
          Type: Api
          Properties:
            Path: /bookings
            Method: POST

  BookingNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hotel-service-booking-notification-local
      CodeUri: src/booking_notification/
      Handler: app.lambda_handler
      Description: Send booking confirmation emails
      MemorySize: 256
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HotelsTable
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
        - SESBulkTemplatedCrudPolicy:
            IdentityName: "*"

  # ============================================================================
  # DYNAMODB TABLES (for local testing)
  # ============================================================================

  HotelsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hotel-service-hotels-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hotelId
          AttributeType: S
      KeySchema:
        - AttributeName: hotelId
          KeyType: HASH

  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hotel-service-rooms-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: roomId
          AttributeType: S
        - AttributeName: hotelId
          AttributeType: S
      KeySchema:
        - AttributeName: roomId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: HotelIdIndex
          KeySchema:
            - AttributeName: hotelId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hotel-service-bookings-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookingId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: roomId
          AttributeType: S
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: RoomIdIndex
          KeySchema:
            - AttributeName: roomId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hotel-service-idempotency-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  HotelServiceApi:
    Description: API Gateway endpoint URL for local testing
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  
  SearchHotelsFunction:
    Description: Search Hotels Lambda Function ARN
    Value: !GetAtt SearchHotelsFunction.Arn
  
  GetHotelFunction:
    Description: Get Hotel Lambda Function ARN
    Value: !GetAtt GetHotelFunction.Arn
  
  CreateBookingFunction:
    Description: Create Booking Lambda Function ARN
    Value: !GetAtt CreateBookingFunction.Arn
