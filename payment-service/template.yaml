AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Payment Service - SAM Local Testing

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    Environment:
      Variables:
        PAYMENT_TABLE: !Ref PaymentTable

Resources:
  # DynamoDB Table
  PaymentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: payments-local
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: paymentId
          AttributeType: S
      KeySchema:
        - AttributeName: paymentId
          KeyType: HASH

  # Lambda Functions
  ProcessPaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/process_payment/
      Handler: app.lambda_handler
      Events:
        ProcessPayment:
          Type: Api
          Properties:
            Path: /payments
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentTable

  GetPaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_payment/
      Handler: app.lambda_handler
      Events:
        GetPayment:
          Type: Api
          Properties:
            Path: /payments/{paymentId}
            Method: get
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PaymentTable

Outputs:
  PaymentApi:
    Description: "API Gateway endpoint URL for Payment Service"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  PaymentTable:
    Description: "DynamoDB Payment Table"
    Value: !Ref PaymentTable
