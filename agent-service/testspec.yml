version: 0.2

# CodeBuild testspec for Agent Service
# Purpose: Run unit tests

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing test dependencies..."
      - pip install --upgrade pip
      - pip install pytest pytest-cov pytest-mock boto3 requests strands-agents
      
  pre_build:
    commands:
      - echo "Pre-test phase started on `date`"
      
  build:
    commands:
      - echo "Running unit tests..."
      - cd agent-service
      
      # Run tests with coverage
      - pytest tests/ -v --cov=src --cov-report=term --cov-report=html
      
      - echo "Tests completed"
      
  post_build:
    commands:
      - echo "Test phase completed on `date`"

reports:
  pytest_reports:
    files:
      - 'agent-service/test-results.xml'
    file-format: 'JUNITXML'

artifacts:
  files:
    - agent-service/htmlcov/**/*
  name: agent-service-test-results
