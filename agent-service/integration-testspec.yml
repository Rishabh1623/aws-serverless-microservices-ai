version: 0.2

# CodeBuild integration testspec for Agent Service
# Purpose: Test agent API endpoints with real AWS services

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing test dependencies..."
      - pip install --upgrade pip
      - pip install pytest requests boto3
      
  pre_build:
    commands:
      - echo "Pre-test phase started on `date`"
      - echo "Getting Agent API endpoint..."
      - export AGENT_API_URL=$(aws apigatewayv2 get-apis --query "Items[?Name=='agent-service-dev'].ApiEndpoint" --output text)
      - echo "Agent API URL: $AGENT_API_URL"
      
  build:
    commands:
      - echo "Running integration tests..."
      - cd agent-service/integration-tests
      
      # Run integration tests
      - pytest test_agent_api.py -v --junitxml=../../test-results.xml
      
      - echo "Integration tests completed"
      
  post_build:
    commands:
      - echo "Integration test phase completed on `date`"

reports:
  integration_test_reports:
    files:
      - 'test-results.xml'
    file-format: 'JUNITXML'
