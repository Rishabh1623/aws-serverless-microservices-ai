version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      - wget https://releases.hashicorp.com/terraform/1.6.0/terraform_1.6.0_linux_amd64.zip
      - unzip terraform_1.6.0_linux_amd64.zip
      - mv terraform /usr/local/bin/
      - terraform --version

  pre_build:
    commands:
      - echo "Initializing Terraform..."
      - cd terraform/hotel-service/prod
      - terraform init -backend-config="bucket=terraform-state-${AWS_ACCOUNT_ID}"

  build:
    commands:
      - echo "Applying Terraform changes with canary deployment..."
      - terraform apply -auto-approve

  post_build:
    commands:
      - echo "Production deployment completed"
      - terraform output -json > outputs.json
      - cat outputs.json

artifacts:
  files:
    - terraform/hotel-service/prod/outputs.json
  name: terraform-outputs-prod
